name: Validate Infra and Promote to Homologation

on:
  push:
    branches:
      - 'feature/**'
      - 'feature-*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    environment: homologation

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Validate CloudFormation
        run: |
          for template in cloudformation/*.yml; do
            echo "Validating $template"
            aws cloudformation validate-template --region ${{ vars.AWS_REGION }} --template-body file://$template || exit 1
          done

      - name: Create Pull Request to Homologation
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Promote Feature -> Homologation'
          body: 'Automated PR from feature to homologation.'
          base: homologation
          branch: ${{ github.ref_name }}